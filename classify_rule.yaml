ops-cv:
  src:
    release:
      - image/
      - objdetect/
      - common/
    unrelease:
      - examples/
      - docs/
      - tests/
      - scripts/
      - cmake/
      - experimental/
      - .clang-format
      - build.sh
      - classify_rule.yaml
      - install_deps.sh
      - LICENSE
      - OAT.xml
      - requirements.txt
      - Third_Party_Open_Source_Software_Notice
      - version.info
      - "*.md"
      - "*/*/*.md"
      - "*/*/tests/"
      - "*/*/examples/"
      - "*/*/docs/"
      - CMakeLists.txt
      - "*/CMakeLists.txt"
      - "*/*/CMakeLists.txt"
      - "*/*/*/CMakeLists.txt"
      - "*/*/*/*/CMakeLists.txt"
      - "*/*/*/*/*/CMakeLists.txt"
      - "*/*/*/*/*/*/CMakeLists.txt"
      - "*/*/*/*_def.cpp"
      # - "*/*/*/*_apt.cpp"
      - "*/*/op_host/config/"
      - "build/third_party/src/external_eigen_cv/"


